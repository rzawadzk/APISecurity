[project]
name = "api-scout"
version = "0.2.0"
description = "API Discovery & Inventory Tool — passive log analysis + active scanning"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Rafal Zawadzki", email = "rafzaw@gmail.com" },
]
keywords = ["api", "security", "discovery", "inventory", "owasp", "aspm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    # python-multipart is required by FastAPI whenever a route declares
    # Form(...) parameters — the login endpoint does. FastAPI does not
    # declare it transitively, so pin it here.
    "python-multipart>=0.0.9",
    # Auth + sessions
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    # Observability
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/rzawadzk/APISecurity"
Repository = "https://github.com/rzawadzk/APISecurity"
Issues = "https://github.com/rzawadzk/APISecurity/issues"
Changelog = "https://github.com/rzawadzk/APISecurity/releases"

[project.scripts]
api-scout = "api_scout.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api_scout*"]
exclude = ["tests*", "samples*"]

# Ship migration SQL files alongside the Python code. Without this,
# setuptools drops the .sql files from the wheel and runtime
# migrations break on a pip-installed install.
[tool.setuptools.package-data]
"api_scout.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
